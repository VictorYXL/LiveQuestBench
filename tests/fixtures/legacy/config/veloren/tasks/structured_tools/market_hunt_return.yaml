id: market_hunt_return
game: veloren
task_type: structured_tool
task: Prepare through the native merchant market, defeat the designated east Green Legoom and return with
  reserves. Wear rawhide chest armor before your first damaging strike on the enemy. Finish wearing that
  armor, holding at least one minor potion and ten coins, alive without having died at [18708.5,10806.5,501],
  grounded within 2 metres horizontally and 0.5 vertically at speed <=0.1 m/s. You start with three minor
  potions, a starter sword and ordinary worker clothing, but no rawhide armor or coins. An existing native
  merchant occupies a small roofed shop near [18710.5,10809.5,501] in this authored courtyard. It uses its
  unchanged native AI and real prices, and has rawhide chest armor and coins available. Approach the
  south-facing counter from [18710.5,10806.5,501] and trade through its window; the walls and low roof
  prevent walking out of the shop. Locate the named merchant within the shop rather than relying on
  its exact setup point. Trade some of
  your potions while budgeting for healing and the final reserve. T opens nearby native trade; acceptance
  advances through the normal review phases. Inspect the actual completed transfer and equip the armor
  before fighting. The enemy starts in a separate eastern hunting yard near [18796.5,10824.5,501],
  over 85 metres from the merchant's initial position. A three-metre divider at y=10815 ends
  at x=18718; the northern divider at x=18714 spans y=10818..10827. Exit the market courtyard
  through its east-wall opening at x=18727, y=10820..10826. A six-metre-wide, railed passage
  continues east to the hunting yard at x=18784..18804, y=10816..10832. All walking surfaces
  are at z=501; return by the same passage. Courtyards have ordinary six-metre perimeter walls.
  The enemy must actually die after you damage it. The scorer checks native pre-strike
  equipment, death, survival and final holdings/arrival, not exclusive provenance of each acquired item.
  The world continues while you think. Release controls before your final answer.
