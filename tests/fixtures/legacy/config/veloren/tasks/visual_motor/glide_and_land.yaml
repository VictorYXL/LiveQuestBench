task: You start on the raised launch block at [18724.5,10810.5,483], facing positive
  y. Use your equipped glider to fly at least six horizontal metres while actually
  airborne in native gliding state, then land on the lower platform within 18 horizontal
  metres and one vertical metre of [18724.5,10870.5,471]. Drawing the glider on the
  ground does not count. Walking into the zone after landing elsewhere does not count
