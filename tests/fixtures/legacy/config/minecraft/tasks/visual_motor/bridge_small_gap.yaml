id: bridge_small_gap
game: minecraft
task_type: visual_motor
task: Build an oak-plank crossing and reach the far bank. You start at [0.5,72,19.5],
  facing east (+X). The trench interrupts the ground at X=2 through 5. Leave one new
  oak plank in each floor cell [2,71,19], [3,71,19], [4,71,19], [5,71,19]. Finish
  alive and grounded within one horizontal block and half a vertical block of [7.5,72,19.5],
  with speed at most 0.1 blocks/tick. You have sixteen planks; other ordinary movement
  and construction are allowed. Release controls and finish with a text answer.
