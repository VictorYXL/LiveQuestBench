game: minecraft
task_type: visual_motor
task: Scout two uncertain passages, clear both occupied outposts, recover the Outpost Records and return
  alive to the yellow camp marker [0.5,72,0.5]. Prepare a stone or iron sword and obtain native kill credit
  for the Husk Sentinel (initially [28.5,72,0.5]) and Outpost Spider (initially [62.5,72,0.5]), holding
  a sword of a type you crafted this episode at each kill. Recover the records from the chest at [68,72,0].
  Finish grounded within 2 blocks horizontally and 0.5 vertically of camp, at saved motion <=0.1 blocks/tick,
  carrying the records. You must not die. Two tall stone dividers cross the courtyard at x=20 and x=45.
  At each divider, the candidate passages are near z=-8 and z=7, at walking height y=72. One candidate
  is open and one is blocked at each divider; the actual openings are not specified. Discover them locally.
  Do not assume the next divider has the same opening as the previous one. Remember usable passages for
  your return. All blocks are ordinary native blocks; creative construction or other native solutions
  are allowed, not secretly rejected by the scorer. You wear iron armor and carry eight planks, four cobblestone,
  two iron ingots and three bread, but no weapon. The camp crafting table is at [-1,72,2]. A chest at
  [50,72,5] contains four extra bread. Decide when to scout, fight, resupply or heal. Health, hunger,
  durability and inventory persist throughout. Difficulty is Easy, time is noon, and the spider has normal
  daylight behavior. The world continues while you reason. Finish with a text answer and release controls.
time_limit_seconds: 900
