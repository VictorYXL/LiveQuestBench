id: caravan_protection_team_sheltered
game: veloren
task_type: visual_motor
task: 'Bring Alpha''s original sheep and both players alive to the stone shelter at
  the far end of the route. The sheep must never die and must finish owned by Alpha,
  grouped with Alpha, and within four metres of Alpha.

  Both players and the original sheep begin in a ground-level covered holding bay.
  Its open exit is along the southern side, through a short dogleg corridor; there
  is no locked door or protected NPC. Native stay does not freeze or shield the sheep.
  A guard may leave through that corridor and draw threats away while the owner waits
  with the sheep, then guide it along the same ordinary ground route. The bay''s real
  walls prevent the former exposed-ledge drop, not all possible harm. The route is
  roughly fifty metres long with a broad fork and cover pockets. Native enemies may
  approach from either side. The sheep follows ordinary pet behavior, without automatic
  protection. Clearing threats first or avoiding them is legal.

  Both players must finish stationary on the ground at the shelter. Player death does
  not restore the sheep, stock or enemies.

  Native control: when the owned pet''s HUD offers V Stay, V requests staying. Confirm
  the displayed state; native pet AI and danger remain active.'
