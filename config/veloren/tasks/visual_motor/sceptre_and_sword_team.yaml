id: sceptre_and_sword_team
game: veloren
task_type: visual_motor
task: 'Defeat the original wolf and return both players alive to the rally arch with
  at least sixty health each.

  During the encounter, one player must actually restore the other player''s health
  with sceptre regeneration after the recipient has been damaged by that original
  wolf. The heal must occur while the wolf is still alive and within thirty native
  seconds of its damage. Healing the initial injury before any wolf hit does not count.

  Alpha starts at seventy-five health with a sword and rawhide chest; Beta has a sceptre
  and light clothing. Both are native Group members. Generate combo through ordinary
  combat, coordinate healing range and recovery, and finish stationary on the ground
  together at the arch near the start. The court is enclosed. Death does not reset
  supplies, enemies or time.'
