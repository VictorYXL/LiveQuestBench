task: >-
  Gather the five animal hides lying at [18704.5,10811.5,501], process them
  into leather and prepare rawhide chest armor. Wear it before your first
  damaging strike on either of the two designated Green Legooms, initially
  near [18705.5,10824.5,501] and [18722.5,10824.5,501]. Defeat both and return
  alive wearing the armor to [18708.5,10806.5,501], grounded within 2 metres
  horizontally and 0.5 vertically, at speed <=0.1 m/s. You must not die.
  You know simple_leather and rawhide_chest. The tanning rack is at
  [18705.5,10807.5,501] and crafting bench at [18712.5,10808.5,501].
  A stone divider at y=10815 ends at x=18718; walk around its east end.
  A second wall at x=18714 spans y=10818 through 10827, separating the two
  northern enclosures. The passage between enclosures is near y=10816.
  The courtyard has ordinary two-metre perimeter walls. You have a starter
  sword and three minor potions, but no hides in your inventory. The loose
  hides have the native roughly 300-game-second item lifetime from setup:
  collect them before they expire. Native server evidence must observe the
  armor equipped before your first damaging hit; inspect your equipment after
  equipping. Fight in either order, manage distance and energy, and decide
  whether and when to heal. There is no reset or resupply between encounters.
  The world continues while you think. Release controls before your final answer.
