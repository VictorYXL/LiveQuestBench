task: Preserve your owned sheep while defeating the designated wolf, then return together. Neither you
  nor this original sheep may die. Finish alive at [18708.5,10806.5,501], grounded within 2 metres horizontally
  and 0.5 vertically at speed <=0.1 m/s, with the living sheep still owned by you, in your group and within
  4 metres of you. The sheep starts near [18711.5,10806.5,501] with its ordinary full health and native
  AI; its body subtype is selected by the native spawn command. It is not tethered or invulnerable. Nearby
  owned pets support the native V stay/follow toggle, or ST PetStayTool; inspect the resulting pet state.
  Staying does not protect it from damage. The normal-health wolf starts near [18722.5,10824.5,501]. A
  three-metre divider at y=10815 ends at x=18718; the northern divider at x=18714 spans y=10818..10827.
  The courtyard has ordinary two-metre perimeter walls. You have a starter sword and three minor potions.
  Choose where to leave or lead the sheep and how to resolve the threat. The wolf must actually die after
  you damage it; no particular support input, last blow or healing action is required. The world continues
  while you think. Release controls before your final answer.
