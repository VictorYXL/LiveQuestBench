id: shared_workshop_exchange
game: veloren
task_type: visual_motor
task: 'Make and equip leather chest armor on Alpha and leather boots on Beta, retain
  a worker shirt in Alpha''s inventory and sandals in Beta''s inventory, and reunite
  alive at the central stone arch.

  Alpha starts with thirteen tough hides, Beta with two animal hides. Both know the
  relevant leather recipes. The tanning rack and crafting bench are near opposite
  stores in the walled workshop court, about thirty metres apart.

  Exchange materials or finished goods using native trade. Either player may do the
  crafting; plan shared materials before spending them. Finish stationary on the ground
  together at the arch. Death does not replenish materials or time.

  Native controls: I opens inventory; select an item and click it again to use or
  equip it. E interacts with an observed station and opens its station-bound crafting
  window; C opens general crafting. T invites a nearby actor to trade, Y accepts an
  incoming invitation, and N declines. Comma toggles cursor capture; L toggles Free
  Look.'
