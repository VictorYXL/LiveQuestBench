id: regeneration_procedure_transfer
game: veloren
task_type: visual_motor
task: |-
  Restore all three original sheep with your own sceptre regeneration, defeat all
  three original wolves after personally damaging each, and return alive to the
  central stone arch. Each sheep must survive and finish at least ninety percent
  healthy, still owned by you and in your native Group, within thirty-two metres
  of you. Finish standing still on the ground. Do not die.

  The sheep just south of you starts slightly injured, at ninety-six percent
  health. Its nearby wolf is already injured. The western and eastern sheep in
  the northern court start at sixty percent health; the eastern sheep stands on
  a raised stone terrace. Two healthy wolves start beyond the northern divider.
  The southern court offers an initial experience before the larger northern
  recovery, but you may choose any order. Every sheep needs actual restoration
  from you, including the slightly injured one.

  All sheep initially have the ordinary Stay command and remain living native
  pets, not frozen or protected objects. You may command them normally. Your
  walking stick, enemies, health, energy and combo use ordinary game rules.
  Supplies and enemies are finite. Death does not restore animals, resources,
  equipment or time. Normal HUD information and tooltips remain available.
time_limit_seconds: 2700
