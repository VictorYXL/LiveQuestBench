id: ridge_glide_delivery
game: veloren
task_type: visual_motor
task: Land from a glide within about five metres of the low central stone plinth on the plateau opposite
  your starting ridge, after at least twenty-five metres of actual airborne gliding during that flight.
  Any lawful takeoff point is allowed. Then bring at least one animal hide to the small stone shelter
  on that plateau, finishing alive, grounded and still. Walking into the landing zone after landing elsewhere
  does not count. The destination plateau lies north, straight ahead of your initial facing, and below
  the ridge; the shelter is on the far side of the landing plinth. Manage your heading, descent and braking. During
  gliding, forward/backward inputs lower/raise glider pitch. The outer stairs permit another attempt after
  a missed landing. Ordinary death and recovery remain legal without replenishment.
