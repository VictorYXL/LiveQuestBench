id: ridge_scout_ground_team
game: veloren
task_type: visual_motor
task: 'Recover all four pieces of simple leather from the original marked valley bundle,
  then bring both players alive to the exit arch carrying at least four pieces between
  you. Finish grounded and stationary together.

  Alpha starts at a high lookout with two viewpoints and an ordinary broad descending
  stairway; Beta starts on the valley floor. Native creatures move along the branching
  approaches. Report useful sightings and decide how to reach the supply and exit.
  Either player may collect it; killing every creature or sharing damage equally is
  not required.

  The original ground bundle has only a few native minutes before it vanishes and
  is never refilled. Another source or merely possessing matching leather does not
  count. A legal ground-only search is allowed; travel, damage, messages and resource
  use are recorded. Death recovery does not reset the supply or enemies.'
