id: moving_target_bow_hunt_open_court_v3
game: veloren
task_type: structured_tool
task: 'Defeat the original wolf with your bow and return alive to the entrance arch
  carrying at least one potion. Collect all three potions from the original ground
  stack just ahead of the entrance arch; substitute potions do not satisfy collection.

  The same three-potion budget now starts on the ground, not in your inventory.
  The stack has the ordinary native 300-second lifetime and ages for 180 seconds
  during preparation. Its remaining lifetime is not reset when play begins.
  Delaying can permanently lose that original source. After collection there is
  no additional potion timer or combat deadline. Choose between securing the
  exposed stock early and taking time to charge your bow first.

  Your own bow projectile must hit the wolf and your own bow projectile must deliver
  its lethal damage; an earlier arrow followed by a melee or environmental kill does
  not count. The wolf starts injured at 55 health, with ordinary speed and attacks,
  and can reach you across the open court. Choose your spacing, aim and recovery.
  The bow charges while held and fires on release, rather than repeating shots.

  The court has ordinary perimeter walls and a high roof. Finish stationary on the
  ground at the arch. Native death recovery does not restore the wolf, supplies or
  time.

  LookTool sets a direction from your foot-level position; arrows launch from weapon
  height and obey native gravity.'
