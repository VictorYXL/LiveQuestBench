  stone arch. Each wolf must receive one of your bow projectile hits and its lethal damage must also be
  your bow projectile; a token arrow followed by a melee or environmental finish does not count. Stone
  baffles block entrance-level shots. Find useful firing lines from the broad raised ledges while judging
  height and range. Finish standing still on the ground at the arch. Death does not restore spent resources
  or enemies.
