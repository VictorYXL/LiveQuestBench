id: prepare_hunt_return
game: veloren
task_type: structured_tool
task: >-
  Prepare rawhide chest armor (common.items.armor.hide.rawhide.chest) and wear it
  before your first damaging strike on the designated Green Legoom. You start
  with five animal hides, know simple_leather and rawhide_chest, and have a
  tanning rack at [18705.5,10807.5,501] and crafting bench at [18712.5,10808.5,501].
  Then find and defeat the Green Legoom beyond the stone divider, initially near
  [18708.5,10824.5,501], and return alive to [18708.5,10806.5,501], still wearing
  the prepared armor. The divider ends at x=18718; ordinary movement around its
  end is possible. Keep the replaced worker shirt in your bag. Your starter
  sword and two minor potions are finite resources; recovery is optional and
  there is no automatic resupply or reset. The world and enemy continue while
  you think. Native server evidence must observe the armor equipped before
  your first damaging hit; observe your equipment after equipping. At return,
  settle grounded within 1 metre horizontally and 0.5 vertically, at speed
  <=0.1 m/s. You must not die. Finish with a text answer and release all controls.
time_limit_seconds: 600
