task: 'Restore your original sheep''s health with your own regeneration while the
  original wolf is still alive. Defeat that wolf after personally damaging it, and
  finish alive with the sheep alive at at least sixty percent health within four metres
  of you, still owned by you and in your native Group.

  Your native sheep starts injured at sixty percent health. It follows ordinary pet
  behavior and is not protected. The wolf starts at half health beyond the stone divider
  in an enclosed courtyard; side pockets offer room to reposition. Your sceptre uses
  ordinary combat and healing rules; no combo is supplied.

  The original sheep must never die. Your own native death recovery does not restore
  the sheep, enemy, stock or time.'
