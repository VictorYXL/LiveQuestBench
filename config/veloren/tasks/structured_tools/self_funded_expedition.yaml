game: veloren
task_type: structured_tool
task: |-
  Defeat both Green Legooms on the eastern hunting route, then return alive to the stone arch where you started, wearing a rawhide chestpiece and carrying at least one unused minor potion and ten coins.
  One opponent is along the passage east of camp; the other is in the yard at its far end. The merchant and crafting stations are in the starting camp. Choose your own preparation, purchases and encounter order.
  Finish standing still on the ground at the arch.
  Your initial native respawn waypoint is the starting arch. Death does not restore spent resources, enemies, equipment or the time budget.
