task: Produce or purchase a rawhide chestpiece and finish at the starting stone arch wearing it, with
  at least 75 health, two mushroom sticks, one raw mushroom, one twig, one apple, one minor potion and
  five coins. Keep your replaced worker shirt in your bag. A nearby native merchant trades armor and goods
  at ordinary prices; a tanning rack and crafting bench are farther into the courtyard. More mushrooms
  are on its far side; loose supplies expire after about five minutes and are not replenished. Choose
  how to fund equipment and healing while preserving provisions. You know the relevant recipes. Finish
  alive, standing still on the ground. Death does not restore spent resources.
