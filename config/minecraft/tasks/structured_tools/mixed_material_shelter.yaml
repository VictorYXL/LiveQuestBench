id: mixed_material_shelter
game: minecraft
task_type: structured_tool
task: Gather raw resources and leave a small mixed-material shelter with a two-block-high
  open north entrance. You have a stone pickaxe, stone axe and two bread, but no building
  materials. The exact footprint is X=-2..0, Z=4..6. At Y=72 place cobblestone around
  its perimeter except the entrance at [-1,72,4]. At Y=73 repeat that perimeter in
  oak planks, again leaving [-1,73,4] open. Leave the center [-1,72,5] and [-1,73,5]
  empty. Cover all nine footprint cells at Y=74 with oak planks. This requires seven
  cobblestone and sixteen oak planks; obtain them legally from the island. No other
  blocks may occupy the four designated air cells. The new final blocks are checked,
  not resource provenance. Finish alive without having died. For arrival goals, be
  grounded within two horizontal blocks and half a vertical block of the marker, at
  speed no more than 0.1 blocks/tick. Release controls and finish with a text answer.
time_limit_seconds: 1800
