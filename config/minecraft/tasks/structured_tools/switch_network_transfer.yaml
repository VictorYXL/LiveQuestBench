task: Use the first console to discover how its red, blue and green input levers correspond
  to the white, orange and purple output lamps. Obtain practice feedback, then pass
  the first yellow start strip. At the next console light only its orange output;
  at the last console light only its white output. Complete these applications in
  order, using at most four application lever toggles in total. Leave both requested
  outputs on and all other application outputs off. Finish with at least 1 health point and still at the
  far yellow pad. Input/output colours keep their meaning but console layouts change.
  Practice toggles do not count against the application limit. You are in native Adventure
  mode; the bedrock service enclosure protects ordinary fixed redstone wiring. No
  block breaking or placement is permitted by this native mode.
