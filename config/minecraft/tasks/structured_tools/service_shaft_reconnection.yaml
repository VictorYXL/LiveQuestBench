id: service_shaft_reconnection
game: minecraft
task_type: structured_tool
task: Build a usable ascent from the yellow shaft-bottom marker to the upper service landing, recover its original
  Maintenance Part and carry it back to the bottom marker. Leave an unbroken, supported route inside the shaft and
  service passage, traversable both ways with body clearance; temporary pillaring that is removed afterward does
  not count. Landings are roughly 3 and 7 blocks above the bottom. Ladders, stone stairs and cobblestone are supplied,
  and a short upper passage also needs repair. Finish with at least 1 HP, grounded and still.
