task: Finish alive with at least four wheat and the entire 5-by-5 field still planted
  with wheat. The field occupies X=-8 through -4 and Z=3 through 7 at crop height
  Y=72. All 25 plants start ripe. You face the field from its near side and have a
  wooden hoe and four spare seeds. Crops may have any growth stage at the end. The
  final crop state and inventory are checked, not a particular harvest history. Release
  controls and finish with a text answer.
