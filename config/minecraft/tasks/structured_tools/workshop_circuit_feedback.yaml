id: workshop_circuit_feedback
game: minecraft
task_type: structured_tool
task: 'Restore the workshop relay: lever ON must open the iron door and light the lamp; lever OFF must close the
  door and extinguish the lamp. The two marked service leads enter an enclosed native relay whose polarities are
  not labeled. Dust, repeaters and support blocks are supplied. Choose a working connection using actual responses;
  connecting everything need not work. Tests and corrections are allowed, and a first-try solution is valid. Complete
  all construction, mining and other block interactions before your final tests. Then operate only the original
  input lever: demonstrate both input modes in either order, holding each until the matching outputs remain stable
  for at least five native seconds. Any later placement, mining or other block interaction requires demonstrating
  both modes again; walking, looking, eating and returning do not. Leave the lever, door and lamp intact and both
  door approaches clear, then return to the yellow entrance with at least 1 health point, grounded and still.'
