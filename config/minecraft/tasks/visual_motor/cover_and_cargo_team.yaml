task: Together retrieve all three original Supply Bundles from the side-route chests along this roughly
  40-block lane and return both players with at least 1 health point each, carrying the bundles, to the yellow camp pad. Finish standing
  still. Two native skeletons threaten the lane; broad cover bays and building supplies are available.
  Divide protection, fighting and retrieval as you choose. Roles are not locked, and clearing the lane
  before retrieval is legal. Native respawn returns to camp without replacing lost items. Release controls
  before finishing.
