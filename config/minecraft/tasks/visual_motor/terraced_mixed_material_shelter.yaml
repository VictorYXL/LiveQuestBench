id: terraced_mixed_material_shelter
game: minecraft
task_type: visual_motor
task: 'Finish the partly built 4-by-4 shelter on the terraced pad ahead, then return to the yellow marker. Use a
  level cobblestone floor, cobblestone lower perimeter walls, oak-plank upper walls and a full oak-plank roof. Leave a one-block-wide, two-block-high
  doorway at the blue front edge and a clear 2-by-2 interior. Continue the existing front half across the marked pad.
  The floor belongs one block
  above the pad''s gold marker. Keep the doorway accessible from outside. Nearby stone and timber may be gathered.
  Finish with at least 1 HP, grounded and still. Control note: after closing a menu, verify that camera movement actually applies;
  a harmless tiny first movement can prime native mouse recapture.'
