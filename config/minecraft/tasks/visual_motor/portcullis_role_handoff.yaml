task: Together open both gate routes, retrieve the original Gate Parcel and bring both players with at least 1 health point each,
  standing still, to the yellow final chamber with the parcel. The two short gate corridors are enclosed
  by bedrock. You are both in native Adventure mode without block-breaking or placement permissions. Each
  near-side stone pressure station temporarily opens its gate; the far-side lever can keep that route
  open. Ordinary movement, interaction and peer chat are available. Native respawn returns to the entrance
  without replacing lost items. Choose your own legal coordination
  and release controls before finishing.
