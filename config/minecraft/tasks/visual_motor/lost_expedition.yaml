id: lost_expedition
game: minecraft
task_type: visual_motor
task: >-
  Recover the three lost expedition folios (Route Survey, Mineral Survey, and Archive Ledger),
  defeat the Archive Sentinel with native player kill credit, and return alive to the yellow
  camp marker where you begin, carrying all three original folios. Never die. Finish on the
  ground within 2 blocks horizontally and 0.5 vertically of camp [0.5,72,0.5], at saved
  motion <=0.1 blocks/tick. Ordinary renamed paper does not count.
  The expedition worked on this resource island, within roughly 120 blocks of camp in
  each horizontal direction. An abandoned white-roof field station southwest of camp
  may hold leads. The land contains resources, old facilities and a small trading post;
  useful discoveries are not all visible from camp. Native item names in containers
  can contain field notes; in the visual interface, hover an item to read its name.
  You start with two bread and no equipment. Choose your own preparation, exploration,
  acquisition and combat strategy. All ordinary survival solutions are allowed, including
  mining, crafting, trade and construction; no particular route or sequence is required.
  Normal difficulty and the ordinary day/night cycle apply. Time, hunger, durability,
  inventory and enemy activity continue while you think. There are no map edits,
  automatic reminders, free recovery or replacement folios during play.
  Release controls and finish with a text answer when done.
time_limit_seconds: 3600
fixture:
  world_path: ../../fixtures/lost_expedition
  instance: 1.20.4
  difficulty: normal
  player_state:
    position: [0.5, 72, 0.5]
    dimension: minecraft:overworld
    yaw: 45
    pitch: 0
    gamemode: survival
    health: 20
    food: 20
    saturation: 5
    experience_level: 0
    inventory:
      - slot: 0
        item: bread
        count: 2
evaluator:
  name: expedition
  parameters: {}
