task: 'Explore the first three-module wing, then traverse two application wings and
  finish alive and stationary at the centre of the final enlarged chamber. Complete
  the route without dying or respawning.

  Each module has one, two or three shallow niches in the wall beside its entrance.
  Within this instance, a given niche pattern always has the same continuing exit
  side relative to the direction in which you enter. One branch continues; the other
  ends at a solid wall. Learn the architecture through ordinary exploration.

  After the first wing, descend the connecting staircase. Later wings rearrange the
  module order and rotate their orientation. Reuse what you discovered; an absolute
  compass direction or blindly replaying the first turn sequence will not suffice.

  The two application wings together allow at most 344 metres of sampled native travel,
  including detours and backtracking. Practice travel and connecting stairs are outside
  that distance allowance, but still consume episode time. All movement remains ordinary
  native movement; there are no modified controls, recipes or physics. Complete the
  application wings in order and remain in the final chamber.'
