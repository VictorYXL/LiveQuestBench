id: farm_delivery
game: minecraft
task_type: visual_motor
task: Deliver at least eight wheat to the far-bank white marker [14.5,72,39.5], while
  leaving all 25 cells of the original field planted with wheat. The ripe field is
  X=-8..-4, Z=3..7, crop height Y=72. Any final growth stage is allowed. You start
  near the field with a wooden hoe, four spare seeds, six oak planks and two bread.
  Plan harvesting, replanting, carrying the produce and reaching the destination in
  the same life. The trench removes ground at X=2..9, Z=14..64, down through Y=64.
  Standing ground is Y=72. Ground detours exist north at Z=13 and south at Z=65. Repair,
  jumping, digging, gathering additional materials and detours are all legal; no particular
  route or construction history is required. The final crop state, carried wheat and
  arrival are checked; no per-plant harvest history is required. Finish alive without
  having died. For arrival goals, be grounded within two horizontal blocks and half
  a vertical block of the marker, at speed no more than 0.1 blocks/tick. Release controls
  and finish with a text answer.
time_limit_seconds: 900
