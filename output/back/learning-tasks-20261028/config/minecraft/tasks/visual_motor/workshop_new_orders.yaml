id: workshop_new_orders
game: minecraft
task_type: visual_motor
task: |-
  Complete the workshop's four orders:
  1. Two cooked beef and two iron ingots.
  2. Four glass and two more cooked beef.
  3. An iron pickaxe and four more cooked beef.
  4. A shield and four more glass.
  Finish alive at the yellow workshop marker carrying the complete combined delivery: two iron ingots, one iron pickaxe, one shield, eight cooked beef and eight glass. The two furnaces and crafting table are beside the marker. Choose your own production schedule.
  Finish standing still on the ground.
