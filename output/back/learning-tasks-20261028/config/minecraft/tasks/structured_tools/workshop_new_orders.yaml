id: workshop_new_orders
game: minecraft
task_type: structured_tool
task: |-
  Complete the workshop's four orders:
  1. Two cooked beef and two iron ingots.
  2. Four glass and two more cooked beef.
  3. An iron pickaxe and four more cooked beef.
  4. A shield and four more glass.
  Finish alive at the yellow workshop marker carrying the complete combined delivery: two iron ingots, one iron pickaxe, one shield, eight cooked beef and eight glass, plus a reserve of two coal and four oak planks.
  The two furnaces and crafting table are beside the marker. Starting fuel and timber are limited; additional timber and exposed coal are roughly 25 blocks behind your initial facing, with the coal also about 12 blocks to your left. Choose what to gather, how to fuel production and what to reserve.
  Finish standing still on the ground.
