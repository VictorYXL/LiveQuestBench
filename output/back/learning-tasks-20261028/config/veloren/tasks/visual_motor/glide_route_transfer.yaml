id: glide_route_transfer
game: veloren
task_type: visual_motor
task: |-
  Make three actual gliding landings in the enclosed flight courtyard in the order below, then return alive to the stone arch on the lower floor beneath the launch terrace.
  Approximate landing areas relative to your starting position and facing:
  1. 16 metres right, one level below.
  2. 30 metres right and 15 metres forward, another level lower.
  3. 11 metres right and 15 metres forward, on the lower floor.
  Each landing must follow at least six metres of actual airborne gliding and end in the terrace's central area. Walking onto a terrace or briefly opening the glider on landing does not count.
  The lower floor and tall perimeter walls keep ordinary missed flights inside the courtyard. A staircase reconnects the lower floor to the launch terrace.
  Failed flights may be retried within the episode. Previously completed ordered landings remain credited; continue with the next unfinished landing rather than ending after a miss.
  Your initial native respawn waypoint is the launch terrace. Death does not reset progress, repair equipment or extend the time budget. Finish standing still on the ground at the arch.
