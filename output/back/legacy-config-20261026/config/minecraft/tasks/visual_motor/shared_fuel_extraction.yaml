id: shared_fuel_extraction
game: minecraft
task_type: visual_motor
task: 'Reach the far-bank white marker [14.5,72,39.5] carrying an iron pickaxe, a
  shield, four cooked beef, at least one coal and two oak planks. You start with four
  raw iron, four raw beef, two coal, three oak logs, a stone pickaxe and two bread.
  The existing crafting table is at [-1,72,2] and furnace at [1,72,2]. Manage wood
  and fuel across production and the required reserves: burning a reserved resource
  is not permanent failure if you legally replace it before finishing. Native furnace
  fuel continues burning while you think or change inputs. Additional gathering is
  allowed. The trench removes ground at X=2..9, Z=14..64, down through Y=64. Standing
  ground is Y=72. Ground detours exist north at Z=13 and south at Z=65. Repair, jumping,
  digging, gathering additional materials and detours are all legal; no particular
  route or construction history is required. No recipe or exact fuel-use history is
  required. Finish alive without having died. For arrival goals, be grounded within
  two horizontal blocks and half a vertical block of the marker, at speed no more
  than 0.1 blocks/tick. Release controls and finish with a text answer.'
