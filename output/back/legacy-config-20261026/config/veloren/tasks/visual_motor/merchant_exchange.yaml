  and z is up. Decide how much to offer and retain; trades have separate offer and
  confirmation phases. Success checks final holdings and survival, not a particular
  transaction history. Finish alive, release controls and answer. The stock T key
  requests trade with a nearby target; use the ordinary trade interface.'
