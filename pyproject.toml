[project]
name = "livequestbench"
version = "0.1.0"
description = "A benchmark for long-horizon agents in continuously evolving 3D games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29"]

[project.optional-dependencies]
minecraft = ["pillow>=11,<13", "python-xlib>=0.33,<1", "nbtlib>=2,<3"]

[dependency-groups]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: opt-in requests that may consume provider quota",
    "game: opt-in real game checks requiring installed runtimes and explicit consent",
]

[tool.uv]
package = false
